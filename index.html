<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoli Bucin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .monopoly-red { background-color: #990000; }
        .monopoly-dark-red { background-color: #660000; }
        .monopoly-border { border: 3px solid #660000; }
        
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-10deg); }
            40% { transform: translate(1px, -1px) rotate(10deg); }
            60% { transform: translate(-1px, 2px) rotate(0deg); }
            80% { transform: translate(-3px, 1px) rotate(-5deg); }
            100% { transform: translate(1px, -2px) rotate(5deg); }
        }
        .dice-animating {
            animation: shake 0.15s infinite;
            display: inline-block;
        }

        .flipped-container {
            transform: scaleX(-1) scaleY(-1);
        }
    </style>
</head>
<body class="bg-[#5a0000] text-gray-800 font-sans min-h-screen flex flex-col items-center justify-between p-2 relative max-w-md mx-auto">

    <!-- AUDIO SOUND EFFECT DADU (AMBIL DARI FOLDER LOKAL GITHUB) -->
    <audio id="dice-sound" preload="auto">
        <source src="assets/dice-roll.mp3" type="audio/mpeg">
    </audio>

    <!-- SETUP SCREEN -->
    <div id="setup-screen" class="w-full max-w-md bg-white monopoly-border rounded-2xl p-6 shadow-xl my-auto z-50">
        <h1 class="text-3xl font-extrabold text-center text-red-800 mb-2">🎲 Monopoli Bucin 💖</h1>
        <p class="text-center text-sm text-gray-600 mb-6">Game Monopoli khusus buat kamu dan doi tersayang!</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-red-900 mb-1">Nama Pemain 1:</label>
                <input type="text" id="player1-name" placeholder="Tulis Nama" class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-red-500">
            </div>
            <div>
                <label class="block text-sm font-bold text-red-900 mb-1">Nama Pemain 2:</label>
                <input type="text" id="player2-name" placeholder="Tulis Nama" class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-red-500">
            </div>
            
            <button onclick="startGame()" class="w-full monopoly-red text-white font-bold py-3 rounded-xl shadow-lg hover:bg-red-800 transition">Mulai Permainan 🚀</button>
            
            <!-- GARIS PEMISAH -->
            <div class="border-t border-red-200 my-2"></div>

            <!-- TOMBOL PANDUAN BERMAIN -->
            <button onclick="openGuideModal()" class="w-full bg-amber-600 text-white font-bold py-2.5 rounded-xl shadow-lg hover:bg-amber-700 transition text-sm">📖 Panduan Bermain</button>
        </div>
    </div>

    <!-- GAMEPLAY SCREEN -->
    <div id="game-screen" class="w-full flex flex-col justify-between hidden space-y-2 py-1">
        
        <!-- PEMAIN 2 -->
        <div id="p2-container" class="w-full bg-[#fae1df] monopoly-border rounded-3xl p-3 shadow-xl flex flex-col space-y-2 transition-opacity duration-300">
            <div class="flipped-container flex flex-col space-y-2">
                <div class="bg-white monopoly-border rounded-2xl p-2.5 shadow-inner">
                    <div class="grid grid-cols-2 gap-2 items-center">
                        <div class="bg-[#800000] text-white font-black text-sm py-2 px-3 rounded-xl text-center shadow truncate">
                            <span id="p2-display-name">Pemain 2</span>
                        </div>
                        <div class="bg-white border-2 border-[#800000] rounded-xl py-2 px-2 text-center text-xs font-extrabold text-[#800000] shadow-sm truncate">
                            Rp <span id="p2-money">15.000.000</span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div class="flex flex-col space-y-2">
                        <div class="bg-[#800000] text-white rounded-xl p-2 text-center shadow">
                            <p class="text-xs font-bold mb-1">Aset / Biaya</p>
                            <p class="text-[11px] font-medium leading-tight text-red-100 min-h-[30px]" id="p2-properties">Belum ada</p>
                        </div>
                        <div id="p2-action-panel" class="bg-white monopoly-border rounded-xl p-2 shadow flex flex-col justify-center text-center min-h-[45px]"></div>
                        <button id="p2-roll-btn" onclick="rollDice()" class="w-full bg-green-600 text-white font-black text-xs py-3 rounded-xl shadow-lg hover:bg-green-700 transition">
                            🎲 Lempar Dadu
                        </button>
                    </div>
                    <div id="p2-btn-group" class="bg-white monopoly-border rounded-xl p-2 shadow flex flex-col justify-center space-y-1.5"></div>
                </div>
            </div>
        </div>

        <!-- PANEL TENGAH -->
        <div class="w-full bg-white monopoly-border rounded-2xl p-3 shadow-md grid grid-cols-2 gap-2 items-center">
            <div class="text-left pr-2 border-r border-red-200 flex flex-col justify-between">
                <div class="flipped-container mb-2">
                    <p class="text-[9px] text-gray-500 uppercase font-bold tracking-wider">POSISI <span id="p2-pos-label">Pemain 2</span></p>
                    <h3 id="current-tile-name-top" class="text-xs font-extrabold text-red-800 truncate">START (Kotak #0)</h3>
                </div>
                <div class="border-t border-dashed border-red-300 my-1"></div>
                <div>
                    <p class="text-[9px] text-gray-500 uppercase font-bold tracking-wider">POSISI <span id="p1-pos-label">Pemain 1</span></p>
                    <h3 id="current-tile-name-bot" class="text-xs font-extrabold text-red-800 truncate">START (Kotak #0)</h3>
                </div>
            </div>
            <div class="flex items-center justify-center">
                <div id="dice-wrapper" class="w-full text-center transition-transform duration-300">
                    <p class="text-[10px] font-bold text-red-900 mb-0.5" id="center-turn-label">Giliran Kamu</p>
                    <div class="flex items-center justify-center space-x-3">
                        <div id="dice-box" class="text-3xl font-black text-red-800">🎲 <span id="dice-icon">⚀</span></div>
                        <div class="text-left">
                            <p class="text-[9px] text-gray-600 leading-tight">Angka Dadu:</p>
                            <p id="dice-value" class="text-sm font-black text-red-900">-</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PEMAIN 1 -->
        <div id="p1-container" class="w-full bg-[#fae1df] monopoly-border rounded-3xl p-3 shadow-xl flex flex-col space-y-2 transition-opacity duration-300">
            <div class="bg-white monopoly-border rounded-2xl p-2.5 shadow-inner">
                <div class="grid grid-cols-2 gap-2 items-center">
                    <div class="bg-[#800000] text-white font-black text-sm py-2 px-3 rounded-xl text-center shadow truncate">
                        <span id="p1-display-name">Pemain 1</span>
                    </div>
                    <div class="bg-white border-2 border-[#800000] rounded-xl py-2 px-2 text-center text-xs font-extrabold text-[#800000] shadow-sm truncate">
                        Rp <span id="p1-money">15.000.000</span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div class="flex flex-col space-y-2">
                    <div class="bg-[#800000] text-white rounded-xl p-2 text-center shadow">
                        <p class="text-xs font-bold mb-1">Aset / Biaya</p>
                        <p class="text-[11px] font-medium leading-tight text-red-100 min-h-[30px]" id="p1-properties">Belum ada</p>
                    </div>
                    <div id="p1-action-panel" class="bg-white monopoly-border rounded-xl p-2 shadow flex flex-col justify-center text-center min-h-[45px]"></div>
                    <button id="p1-roll-btn" onclick="rollDice()" class="w-full bg-green-600 text-white font-black text-xs py-3 rounded-xl shadow-lg hover:bg-green-700 transition">
                        🎲 Lempar Dadu
                    </button>
                </div>
                <div id="p1-btn-group" class="bg-white monopoly-border rounded-xl p-2 shadow flex flex-col justify-center space-y-1.5"></div>
            </div>
        </div>

    </div>

    <!-- MODAL POPUP GAME -->
    <div id="card-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div id="modal-box" class="bg-white rounded-2xl monopoly-border p-6 max-w-sm w-full text-center shadow-2xl space-y-4 transition-transform duration-300">
            <div id="modal-icon" class="text-4xl">🌟</div>
            <h3 id="modal-title" class="text-xl font-black text-red-900">INFORMASI</h3>
            <div id="modal-content" class="bg-red-50 p-4 rounded-xl text-sm font-medium text-red-900 border border-dashed border-red-300 text-left max-h-60 overflow-y-auto"></div>
            <button id="modal-close-btn" onclick="closeCardModal()" class="w-full monopoly-red text-white font-bold py-3 rounded-xl shadow-lg hover:bg-red-800 transition">Sudah Selesai ✨</button>
        </div>
    </div>

    <script>
        const tiles = [
            { name: "START", type: "start", price: 0, buyoutCount: 0 },
            { name: "Jakarta", type: "property", price: 500000, owner: null, buyoutCount: 0 },
            { name: "Tantangan", type: "challenge", buyoutCount: 0 },
            { name: "Bogor", type: "property", price: 800000, owner: null, buyoutCount: 0 },
            { name: "Bandung", type: "property", price: 1200000, owner: null, buyoutCount: 0 },
            { name: "Kesempatan", type: "chance", buyoutCount: 0 },
            { name: "Malang", type: "property", price: 1600000, owner: null, buyoutCount: 0 },
            { name: "Stasiun", type: "property", price: 2500000, owner: null, buyoutCount: 0 }, 
            { name: "Surabaya", type: "property", price: 2000000, owner: null, buyoutCount: 0 },
            { name: "Jogjakarta", type: "property", price: 2400000, owner: null, buyoutCount: 0 },
            { name: "Kesempatan", type: "chance", buyoutCount: 0 },
            { name: "Denpasar", type: "property", price: 3000000, owner: null, buyoutCount: 0 },
            { name: "Tantangan", type: "challenge", buyoutCount: 0 },
            { name: "Lampung", type: "property", price: 3500000, owner: null, buyoutCount: 0 },
            { name: "Penjara", type: "jail", buyoutCount: 0 }, 
            { name: "Pekanbaru", type: "property", price: 4000000, owner: null, buyoutCount: 0 },
            { name: "Medan", type: "property", price: 4600000, owner: null, buyoutCount: 0 },
            { name: "Kesempatan", type: "chance", buyoutCount: 0 },
            { name: "Balikpapan", type: "property", price: 5300000, owner: null, buyoutCount: 0 },
            { name: "Banjarmasin", type: "property", price: 6000000, owner: null, buyoutCount: 0 },
            { name: "Bandara", type: "property", price: 7000000, owner: null, buyoutCount: 0 }, 
            { name: "Samarinda", type: "property", price: 6800000, owner: null, buyoutCount: 0 },
            { name: "Kesempatan", type: "chance", buyoutCount: 0 },
            { name: "Manado", type: "property", price: 7600000, owner: null, buyoutCount: 0 },
            { name: "Makassar", type: "property", price: 8500000, owner: null, buyoutCount: 0 },
            { name: "Tantangan", type: "challenge", buyoutCount: 0 },
            { name: "Jayapura", type: "property", price: 10000000, owner: null, buyoutCount: 0 }
        ];

        const chanceCards = [
            "Tatap mata doi mu lalu bilang 'I Love You' dengan tulus.",
            "Pegang tangan doi mu selama 3 giliran permainan berikutnya.",
            "Puji 3 hal manis tentang doi mu sekarang juga!",
            "Kirimkan sticker gombal paling lucu ke WhatsApp doi mu."
        ];

        const challengeCards = [
            "Beliin 1 minuman favorit untuk doi mu!",
            "Jilat saos dengan 1 jari di depan doi mu.",
            "Buat story Instagram/WA dengan foto doi mu sekarang.",
            "Pipi kamu dicubit gemes sama doi mu selama 5 detik."
        ];

        let players = [
            { id: 0, name: "Pemain 1", money: 15000000, position: 0, properties: [], inJail: false },
            { id: 1, name: "Pemain 2", money: 15000000, position: 0, properties: [], inJail: false }
        ];
        let currentTurn = 0; 
        let hasRolled = false; 
        const diceSymbols = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

        function startGame() {
            const p1Val = document.getElementById('player1-name').value.trim();
            const p2Val = document.getElementById('player2-name').value.trim();

            if(p1Val) players[0].name = p1Val;
            if(p2Val) players[1].name = p2Val;

            document.getElementById('p1-display-name').innerText = players[0].name;
            document.getElementById('p2-display-name').innerText = players[1].name;
            document.getElementById('p1-pos-label').innerText = players[0].name;
            document.getElementById('p2-pos-label').innerText = players[1].name;

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            updateUI();
        }

        function openGuideModal() {
            let guideText = `
<strong>📜 TATA CARA & ATURAN BERMAIN MONOPOLI BUCIN:</strong><br><br>
1. <strong>Tujuan Permainan:</strong> Kumpulkan aset kota terbanyak dan jaga saldo uangmu agar tidak habis bersama pasangan!<br><br>
2. <strong>Garis / Kotak START:</strong><br>
   - Setiap pemain yang melewati atau mendarat di kotak <strong>START</strong> berhak mendapatkan bonus gaji sebesar <strong>Rp 2.000.000</strong> dari Bank Central.<br><br>
3. <strong>Pembelian Kota / Properti:</strong><br>
   - Jika mendarat di kota yang belum bertuan, kamu bisa membelinya sesuai harga kota tersebut.<br><br>
4. <strong>Pajak & Kota Milik Lawan:</strong><br>
   - Jika mendarat di kota milik pasanganmu, kamu wajib membayar pajak kunjungan sebesar <strong>10%</strong> dari harga dasar kota tersebut kepada pemiliknya.<br><br>
5. <strong>Aturan Buyout (Pengambilalihan Kota):</strong><br>
   - <em>Pembelian / Buyout Pertama:</em> Harganya adalah 1.5x lipat dari harga dasar kota.<br>
   - <em>Pembelian Selanjutnya:</em> Harga buyout akan bertambah 10% dari harga dasar untuk setiap kali kota tersebut berpindah tangan (akumulasi kenaikan bertingkat).<br><br>
6. <strong>Kotak Kesempatan & Tantangan:</strong><br>
   - Berisi misi-misi seru, gombalan, dan tantangan romantis yang harus dilakukan bersama doi.<br><br>
7. <strong>Kotak Penjara:</strong><br>
   - Jika masuk penjara, kamu harus bebas dengan membayar denda Rp 5 Juta, menerima tantangan khusus, atau melempar dadu mendapatkan angka 6.
            `;
            showPopup("📖 PANDUAN BERMAIN", guideText, "📖");
        }

        function getBuyoutPrice(tile) {
            if (tile.buyoutCount === 0) {
                return Math.round(tile.price * 1.5);
            } else {
                let baseBuyout = tile.price * 1.5;
                let increment = tile.price * 0.10 * tile.buyoutCount;
                return Math.round(baseBuyout + increment);
            }
        }

        function updateUI() {
            document.getElementById('p1-money').innerText = players[0].money.toLocaleString('id-ID');
            document.getElementById('p2-money').innerText = players[1].money.toLocaleString('id-ID');

            document.getElementById('p1-properties').innerText = players[0].properties.length > 0 ? players[0].properties.join(', ') : 'Belum ada';
            document.getElementById('p2-properties').innerText = players[1].properties.length > 0 ? players[1].properties.join(', ') : 'Belum ada';

            const p1Container = document.getElementById('p1-container');
            const p2Container = document.getElementById('p2-container');
            const diceWrapper = document.getElementById('dice-wrapper');

            if (currentTurn === 0) {
                p1Container.style.opacity = "1";
                p2Container.style.opacity = "0.5";
                diceWrapper.classList.remove('flipped-container');
            } else {
                p1Container.style.opacity = "0.5";
                p2Container.style.opacity = "1";
                diceWrapper.classList.add('flipped-container');
            }

            let p1Tile = tiles[players[0].position];
            let p2Tile = tiles[players[1].position];
            
            document.getElementById('current-tile-name-top').innerText = `${p2Tile.name} (Kotak #${players[1].position})`;
            document.getElementById('current-tile-name-bot').innerText = `${p1Tile.name} (Kotak #${players[0].position})`;

            let activeTile = tiles[players[currentTurn].position];
            renderActionPanels(activeTile);
        }

        function renderActionPanels(tile) {
            const p1Panel = document.getElementById('p1-action-panel');
            const p2Panel = document.getElementById('p2-action-panel');
            const p1BtnGroup = document.getElementById('p1-btn-group');
            const p2BtnGroup = document.getElementById('p2-btn-group');
            const p1Roll = document.getElementById('p1-roll-btn');
            const p2Roll = document.getElementById('p2-roll-btn');

            p1Panel.innerHTML = '';
            p2Panel.innerHTML = '';
            p1BtnGroup.innerHTML = '';
            p2BtnGroup.innerHTML = '';

            let activePanel = currentTurn === 0 ? p1Panel : p2Panel;
            let activeBtnGroup = currentTurn === 0 ? p1BtnGroup : p2BtnGroup;
            let activeRollBtn = currentTurn === 0 ? p1Roll : p2Roll;
            let inactiveRollBtn = currentTurn === 0 ? p2Roll : p1Roll;
            let inactivePanel = currentTurn === 0 ? p2Panel : p1Panel;
            let inactiveBtnGroup = currentTurn === 0 ? p2BtnGroup : p1BtnGroup;

            inactiveRollBtn.disabled = true;
            inactiveRollBtn.classList.add('opacity-40', 'cursor-not-allowed');
            inactivePanel.innerHTML = `<span class="text-xs font-bold text-red-900">Tunggu ya!</span>`;
            inactiveBtnGroup.innerHTML = `<span class="text-[10px] text-gray-400 text-center italic">Menunggu giliran...</span>`;

            let player = players[currentTurn];

            if (player.inJail && tile.type === 'jail') {
                activeRollBtn.disabled = true;
                activeRollBtn.classList.add('opacity-40');
                activePanel.innerHTML = `<span class="text-xs font-bold text-red-800">Di Penjara!</span>`;
                activeBtnGroup.innerHTML = `
                    <p class="text-[10px] font-bold text-red-800 text-center mb-0.5">Area Penjara</p>
                    <button onclick="jailPayFine()" class="w-full bg-amber-600 text-white font-bold py-1.5 px-1 rounded-lg text-[10px] shadow hover:bg-amber-700">Bayar Denda (5 Juta)</button>
                    <button onclick="jailAcceptChallenge()" class="w-full bg-purple-600 text-white font-bold py-1.5 px-1 rounded-lg text-[10px] shadow hover:bg-purple-700">Tantangan Bebas</button>
                    <button onclick="jailRollDice()" class="w-full bg-green-600 text-white font-bold py-1.5 px-1 rounded-lg text-[10px] shadow hover:bg-green-700">🎲 Lempar Dadu (6)</button>
                `;
                return;
            }

            if (!hasRolled) {
                activeRollBtn.disabled = false;
                activeRollBtn.classList.remove('opacity-40', 'cursor-not-allowed');
                activePanel.innerHTML = `<span class="text-[11px] font-bold text-red-700">Silakan lempar dadu!</span>`;
            } else {
                activeRollBtn.disabled = true;
                activeRollBtn.classList.add('opacity-40', 'cursor-not-allowed');
                activePanel.innerHTML = `<span class="text-[11px] font-bold text-gray-600">Selesai melempar</span>`;
            }

            if (hasRolled && tile.type === 'property') {
                if (tile.owner === null) {
                    activeBtnGroup.innerHTML = `
                        <p class="text-[10px] font-bold text-gray-500 text-center mb-0.5">Aset belum dimiliki</p>
                        <button onclick="buyProperty()" class="w-full bg-green-600 text-white font-bold py-2 px-1 rounded-xl text-[11px] shadow hover:bg-green-700 leading-tight">Beli (Rp ${tile.price.toLocaleString('id-ID')})</button>
                        <button onclick="nextTurn()" class="w-full bg-gray-500 text-white font-bold py-2 px-1 rounded-xl text-[11px] shadow hover:bg-gray-600">Lewati</button>
                    `;
                } else if (tile.owner !== currentTurn) {
                    let ownerName = players[tile.owner].name;
                    let taxPrice = Math.round(tile.price * 0.10);
                    let buyoutPrice = getBuyoutPrice(tile);
                    activeBtnGroup.innerHTML = `
                        <p class="text-[10px] font-black text-red-800 text-center mb-0.5 truncate">Milik: ${ownerName}</p>
                        <button onclick="buyOutProperty()" class="w-full bg-green-600 text-white font-bold py-1.5 px-1 rounded-xl text-[10px] shadow hover:bg-green-700 leading-tight">Buyout (Rp ${buyoutPrice.toLocaleString('id-ID')})</button>
                        <button onclick="payTax()" class="w-full bg-red-600 text-white font-bold py-1.5 px-1 rounded-xl text-[10px] shadow hover:bg-red-700 leading-tight">Pajak (Rp ${taxPrice.toLocaleString('id-ID')})</button>
                    `;
                } else {
                    activeBtnGroup.innerHTML = `
                        <p class="text-[10px] font-black text-green-700 text-center mb-0.5">Milik Sendiri</p>
                        <span class="text-[10px] text-center font-bold text-green-700 py-1">Properti Sendiri</span>
                    `;
                    setTimeout(() => nextTurn(), 1200);
                }
            } else if (hasRolled && (tile.type === 'chance' || tile.type === 'challenge')) {
                let infoLabel = tile.type === 'chance' ? 'Kotak Kesempatan' : 'Kotak Tantangan';
                activeBtnGroup.innerHTML = `
                    <p class="text-[10px] font-bold text-gray-500 text-center mb-0.5">${infoLabel}</p>
                    <button onclick="triggerCardPopup()" class="w-full bg-amber-600 text-white font-bold py-2 px-1 rounded-xl text-xs shadow hover:bg-amber-700">Buka Kartu</button>
                `;
            } else if (hasRolled && tile.type !== 'property') {
                activeBtnGroup.innerHTML = `
                    <p class="text-[10px] font-bold text-gray-500 text-center mb-0.5">Area Aman</p>
                    <button onclick="nextTurn()" class="w-full bg-gray-500 text-white font-bold py-2 px-1 rounded-xl text-xs shadow hover:bg-gray-600">Lanjut Giliran</button>
                `;
            }
        }

        function rollDice() {
            if (hasRolled) return;
            
            const diceSound = document.getElementById('dice-sound');
            if (diceSound) {
                diceSound.currentTime = 0;
                diceSound.play().catch(e => console.log("Audio play error:", e));
            }

            executeRoll((diceRoll) => {
                let player = players[currentTurn];
                let oldPos = player.position;
                let newPos = oldPos + diceRoll;

                if (newPos >= tiles.length) {
                    newPos = newPos % tiles.length;
                    player.money += 2000000;
                    showPopup("🎉 BONUS START!", `Yeay! ${player.name} melewati/mencapai garis START dan mendapatkan bonus Rp 2.000.000! 💰`, "💰");
                }

                player.position = newPos;
                hasRolled = true;

                let currentTile = tiles[player.position];
                if (currentTile.type === 'jail') {
                    player.inJail = true;
                    showPopup("🚨 PENJARA!", `Oh tidak! ${player.name} masuk ke kotak Penjara!`, "🚨");
                }

                updateUI();
            });
        }

        function showPopup(title, message, icon, isCard = false, cardType = "") {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('modal-content').innerHTML = message;
            
            let closeBtn = document.getElementById('modal-close-btn');
            if (isCard) {
                closeBtn.innerText = cardType === 'chance' ? "Kesempatan Selesai" : "Tantangan Selesai";
                closeBtn.setAttribute("onclick", "closeCardModalAndNext()");
            } else {
                closeBtn.innerText = "Sudah Selesai ✨";
                closeBtn.setAttribute("onclick", "closeCardModal()");
            }

            const modalBox = document.getElementById('modal-box');
            if (currentTurn === 1) {
                modalBox.classList.add('flipped-container');
            } else {
                modalBox.classList.remove('flipped-container');
            }

            document.getElementById('card-modal').classList.remove('hidden');
        }

        function triggerCardPopup() {
            let currentTile = tiles[players[currentTurn].position];
            let cardText = currentTile.type === 'chance' ? chanceCards[Math.floor(Math.random() * chanceCards.length)] : challengeCards[Math.floor(Math.random() * challengeCards.length)];
            let modalTitle = currentTile.type === 'chance' ? "🌟 KARTU KESEMPATAN" : "🔥 KARTU TANTANGAN";
            let modalIcon = currentTile.type === 'chance' ? "🌟" : "🔥";

            showPopup(modalTitle, `${players[currentTurn].name}, jalankan perintah ini:<br><br><strong>"${cardText}"</strong>`, modalIcon, true, currentTile.type);
        }

        function closeCardModal() {
            document.getElementById('card-modal').classList.add('hidden');
        }

        function closeCardModalAndNext() {
            document.getElementById('card-modal').classList.add('hidden');
            nextTurn();
        }

        function jailRollDice() {
            const diceSound = document.getElementById('dice-sound');
            if (diceSound) {
                diceSound.currentTime = 0;
                diceSound.play().catch(e => console.log("Audio play error:", e));
            }

            executeRoll((diceRoll) => {
                let player = players[currentTurn];
                if (diceRoll === 6) {
                    player.inJail = false;
                    showPopup("🎉 BEBAS!", `Hore! ${player.name} mendapatkan angka 6 dan bebas dari penjara!`, "🎉");
                    updateUI();
                } else {
                    showPopup("❌ BELUM BERHASIL", `Dadu menunjukkan angka ${diceRoll}. Belum berhasil keluar.`, "❌");
                    nextTurn();
                }
            });
        }

        function jailPayFine() {
            let player = players[currentTurn];
            if (player.money >= 5000000) {
                player.money -= 5000000;
                player.inJail = false;
                showPopup("💸 BEBAS DENDA", `${player.name} membayar denda Rp 5.000.000 dan bebas!`, "💸");
                updateUI();
            } else {
                showPopup("⚠️ SALDO KURANG", "Uang kamu tidak cukup untuk membayar denda!", "⚠️");
            }
        }

        function jailAcceptChallenge() {
            let player = players[currentTurn];
            let randCard = challengeCards[Math.floor(Math.random() * challengeCards.length)];
            player.inJail = false;
            showPopup("✨ BEBAS", `${player.name} bebas dengan tantangan:<br><br>🔥 <strong>"${randCard}"</strong>`, "✨");
            updateUI();
        }

        function executeRoll(callback) {
            let diceIcon = document.getElementById('dice-icon');
            let diceBox = document.getElementById('dice-box');
            
            diceBox.classList.add('dice-animating');
            
            let counter = 0;
            let shuffleInterval = setInterval(() => {
                diceIcon.innerText = diceSymbols[Math.floor(Math.random() * 6)];
                counter++;
                
                if (counter > 10) {
                    clearInterval(shuffleInterval);
                    const diceRoll = Math.floor(Math.random() * 6) + 1;
                    diceBox.classList.remove('dice-animating');
                    diceIcon.innerText = diceSymbols[diceRoll - 1];
                    document.getElementById('dice-value').innerText = diceRoll;
                    callback(diceRoll);
                }
            }, 80);
        }

        function buyProperty() {
            let tile = tiles[players[currentTurn].position];
            let player = players[currentTurn];

            if(player.money >= tile.price) {
                player.money -= tile.price;
                tile.owner = currentTurn;
                tile.buyoutCount = 0;
                player.properties.push(tile.name);
                showPopup("🎉 PEMBELIAN BERHASIL", `${player.name} membeli ${tile.name}!`, "🎉");
                nextTouchAndNext();
            } else {
                showPopup("⚠️ SALDO KURANG", "Uang kamu tidak cukup untuk membeli aset ini!", "⚠️");
            }
        }

        function touchAndNext() { nextTurn(); }
        function nextTouchAndNext() { nextTurn(); }

        function payTax() {
            let tile = tiles[players[currentTurn].position];
            let player = players[currentTurn];
            let owner = players[tile.owner];
            let taxAmount = Math.round(tile.price * 0.10);

            if (player.money >= taxAmount) {
                player.money -= taxAmount;
                owner.money += taxAmount;
                showPopup("💸 BAYAR PAJAK", `${player.name} membayar pajak Rp ${taxAmount.toLocaleString('id-ID')} ke ${owner.name}.`, "💸");
                nextTurn();
            } else {
                showPopup("⚠️ SALDO KURANG", "Uang kamu kurang untuk bayar pajak!", "⚠️");
            }
        }

        function buyOutProperty() {
            let tile = tiles[players[currentTurn].position];
            let player = players[currentTurn];
            let prevOwner = players[tile.owner];
            let buyoutPrice = getBuyoutPrice(tile);

            if (player.money >= buyoutPrice) {
                player.money -= buyoutPrice;
                prevOwner.money += buyoutPrice; 
                prevOwner.properties = prevOwner.properties.filter(p => p !== tile.name);
                
                tile.owner = currentTurn;
                tile.buyoutCount++;
                player.properties.push(tile.name);

                showPopup("🏢 BUYOUT BERHASIL", `${player.name} mengambil alih ${tile.name} seharga Rp ${buyoutPrice.toLocaleString('id-ID')}!`, "🏢");
                nextTurn();
            } else {
                showPopup("⚠️ SALDO KURANG", "Uang kamu kurang untuk buyout aset ini!", "⚠️");
            }
        }

        function nextTurn() {
            currentTurn = currentTurn === 0 ? 1 : 0;
            hasRolled = false;
            document.getElementById('dice-icon').innerText = "⚀";
            document.getElementById('dice-value').innerText = "-";
            updateUI();
        }
    </script>
</body>
</html>
